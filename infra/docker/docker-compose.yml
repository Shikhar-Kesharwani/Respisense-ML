version: '3.9'

services:
  # ─── Respisense ML Application ──────────────────────────────────────────────
  app:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: respisense_app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@db:5432/${POSTGRES_DB:-respisense_db}
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET_NAME=${MINIO_BUCKET:-respisense-xrays}
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - app_logs:/app/Logs
    networks:
      - respisense_net

  # ─── Relational Database (PostgreSQL) ───────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: respisense_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-respisense_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - respisense_net

  # ─── Object Storage (MinIO — Self-Hosted S3) ────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: respisense_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"    # S3 API Endpoint
      - "9001:9001"    # MinIO Web Console
    networks:
      - respisense_net

  # ─── Reverse Proxy (Nginx) ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: respisense_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - respisense_net

volumes:
  postgres_data:
  minio_data:
  app_logs:

networks:
  respisense_net:
    driver: bridge
